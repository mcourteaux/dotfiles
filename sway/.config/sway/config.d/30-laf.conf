titlebar_padding 8 3
titlebar_border_thickness 1
font pango:Noto Sans Medium 10

# Window decorations in the same palette as waybar + wlperch.
#                       border  background text    indicator child_border
client.focused          #7aa2f7 #232836    #e4e7ee #9ece6a   #7aa2f7
client.focused_inactive #2b303b #1a1d24    #c8ccd6 #2b303b   #2b303b
client.focused_tab_title #2b303b #1a1d24   #c8ccd6
client.unfocused        #1f232b #111318    #8a92a3 #1f232b   #1f232b
client.urgent           #f7768e #f7768e    #111318 #f7768e   #f7768e
client.placeholder      #111318 #111318    #8a92a3 #111318   #111318
client.background       #111318

gaps inner 30
gaps outer 5
bindsym $mod+g gaps inner all toggle 15; gaps outer all toggle 5

bindsym $mod+shift+g gaps inner all set 0; gaps outer all set 0
